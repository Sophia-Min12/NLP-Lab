name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # numpy arrives with Level 4 (Day 13 onward); Levels 1-3 are
      # standard library only and still run without it.
      - run: pip install pytest numpy
      - run: pytest
